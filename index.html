<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181b" media="(prefers-color-scheme: dark)">
<title>Zugradar</title>
<link rel="icon" href="favicon.svg?v=3" type="image/svg+xml">
<link rel="icon" href="favicon-32.png?v=3" type="image/png" sizes="32x32">
<link rel="icon" href="icon-512.png?v=3" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<!-- Nur die Adresse dieser Seite (ohne Pfad) wird an die Kartendienste gesendet; OpenRailwayMap verlangt einen Referer. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://server.arcgisonline.com https://tiles.openrailwaymap.org; connect-src 'self' https://api.transitous.org; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
/* Schriften liegen im Repo (vendor/fonts), damit beim Laden keine Anfrage an Google geht. */
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(vendor/fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(vendor/fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(vendor/fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(vendor/fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(vendor/fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
/* Layout: Karte füllt den Schirm; oben Bahnhof + Filterchips, unten Reiter und ein Blatt mit Abfahrtstafel-Optik. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --line:#d5dbd9; --fg:#16201f; --muted:#5d6b69;
  --fern:#c8202f; --regio:#3d5a80; --sbahn:#1f8a4c; --stadt:#b3700a;
  --late:#c8202f; --ontime:#1f8a4c; --focus:#0b6bcb;
  --ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sign:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14181b; --surface:#1d2327; --line:#333c41; --fg:#e9eeed; --muted:#98a5a3;
  --fern:#f0616c; --regio:#8fb0db; --sbahn:#55c486; --stadt:#e5a84a;
  --late:#f0616c; --ontime:#55c486; --focus:#7db8f5; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.35 var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

#app{position:fixed;inset:0;display:flex;flex-direction:column}
#map{flex:1;min-height:0;background:var(--bg);z-index:0}

.top{position:absolute;z-index:500;left:0;right:0;top:0;display:flex;flex-direction:column;gap:8px;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.top>*{pointer-events:auto}
.bar{display:flex;gap:8px}
/* kleines × im Feld „Mein Ort“: Ort zurücksetzen */
.stwrap{flex:1;min-width:0;position:relative;display:flex}
.stwrap .station{padding-right:46px}
.stx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:none;color:var(--muted);font:400 24px/1 var(--ui);padding:0;display:grid;place-items:center}
.stx:active{background:var(--line)}
.stx[hidden]{display:none}
.station{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:9px 12px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.station small{color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase;flex:none}
.station b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{flex:none;width:44px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.12);display:grid;place-items:center}
.icon svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:2}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:6px 11px;font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,.1);white-space:nowrap}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);opacity:.35}
.chip[aria-pressed="true"]{border-color:var(--c)}
.chip[aria-pressed="true"] i{opacity:1}
.chip[aria-pressed="false"]{color:var(--muted)}
.chip[aria-expanded="true"]{border-color:var(--fg)}
.menu{max-height:60dvh;overflow-y:auto;align-self:flex-start;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.22);padding:6px 4px;min-width:230px}
.menu h3{margin:4px 10px 2px;font:600 12px/1.2 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.menu label{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer}
.menu label small{margin-left:auto;color:var(--muted);font-size:12px}
.menu i.ring{background:none!important;border:2px solid var(--muted)}
.menu label i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.menu input{width:18px;height:18px;margin:0}
.menu .all{display:flex;gap:12px;padding:4px 10px 6px}
.menu .all button{background:none;border:0;padding:4px 0;color:var(--focus);font-weight:500}
.tm.stand{opacity:.6}
.chip.far{border-style:dashed}
.chip.far[aria-pressed="true"]{color:var(--muted)}
.chip.far[aria-pressed="true"] i{opacity:.45}
.lineq{flex:none;width:118px;font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 11px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.status{align-self:flex-start;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--muted)}
.track{align-self:flex-start;max-width:100%;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.12);overflow:hidden}
.tbtn{min-width:0;background:none;border:0;padding:9px 4px 9px 14px;font:600 14px/1.2 var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tbtn::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px}
.tstop{flex:none;background:none;border:0;padding:0 14px;font-size:22px;line-height:1;color:var(--muted)}
.news{align-self:flex-start;max-width:100%;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--focus);border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.12);font-size:13px;overflow:hidden}
.news button{background:none;border:0;padding:6px 10px;color:var(--fg);text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.news b{color:var(--focus);font-weight:600}
.news .nx{color:var(--muted);padding:6px 12px 6px 6px}
.newsbox h3{font:600 15px/1.2 var(--ui);margin:14px 0 4px}
.newsbox h3:first-child{margin-top:0}
.newsbox ul{margin:0;padding-left:18px}.newsbox li{margin:3px 0}
.newslink{background:none;border:0;padding:6px 0;color:var(--focus);text-decoration:underline;font-weight:500}
.foot{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:14px}
.about h3{font:600 15px/1.2 var(--ui);margin:18px 0 4px}.about h3:first-child{margin-top:0}
.about p{margin:4px 0}.about ul{margin:4px 0;padding-left:18px}.about li{margin:3px 0}
.about a{color:var(--focus)}
.status.err{color:var(--late);border-color:var(--late)}

/* Zugmarken auf der Karte */
.rlab{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.18);
  font:600 13px/1.2 var(--sign);padding:2px 7px;white-space:nowrap}
.rlab.dest{border-color:var(--c);color:var(--c)}
.rlab:before{display:none}
.leaflet-tooltip-left.rlab{margin-left:-10px}
.tm{position:absolute;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
  font:700 13px/1 var(--sign);letter-spacing:.02em;padding:4px 6px;border-radius:5px;color:#fff;background:var(--c);
  border:1.5px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.tm.plan{background:var(--surface);color:var(--c);border:1.5px dashed var(--c)}
.tm em{font-style:normal;font-size:11px;background:var(--surface);color:var(--late);border-radius:3px;padding:1px 3px}
.tm.sel{outline:3px solid var(--focus);outline-offset:2px;font-size:15px;z-index:2}
.c-fern{--c:var(--fern)} .c-regio{--c:var(--regio)} .c-sbahn{--c:var(--sbahn)} .c-stadt{--c:var(--stadt)}
@media (prefers-color-scheme:dark){.tm{color:#101416}}
.leaflet-container{font-family:var(--ui);background:var(--bg)}
.leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--muted)}
.me{width:14px;height:14px;border-radius:50%;background:var(--focus);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--focus);transform:translate(-50%,-50%);position:absolute}

/* Blatt */
.sheet{position:relative;z-index:600;background:var(--surface);border-top:1px solid var(--line);max-height:62dvh;display:flex;flex-direction:column;
  box-shadow:0 -6px 18px rgba(0,0,0,.14);padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.sheet header{display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.sheet header h2{flex:1;min-width:0;margin:0;font:600 17px/1.2 var(--ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet header h2 span{color:var(--muted);font-weight:400}
.x{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--muted)}
.body{overflow-y:auto;min-height:0;padding-bottom:12px;display:flex;flex-direction:column;gap:10px}
.badge{flex:none;font:700 15px/1 var(--sign);letter-spacing:.02em;padding:5px 7px;border-radius:5px;background:var(--c);color:#fff;white-space:nowrap}
@media (prefers-color-scheme:dark){.badge{color:#101416}}
.nowrow{display:flex;gap:12px;align-items:center;justify-content:space-between}
.now{font-weight:500;min-width:0;flex:1}
.speed{flex:none;text-align:right;font:700 30px/1 var(--sign);letter-spacing:.01em}
.speed small{display:block;margin-top:3px;font:500 11px/1.2 var(--ui);color:var(--muted);letter-spacing:0}
.now small{display:block;color:var(--muted);font-weight:400}
.late{color:var(--late);font-weight:600} .ok{color:var(--ontime);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:500}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.btn.pri{background:var(--fg);color:var(--surface);border-color:var(--fg)}
select,.field{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%}
.field{width:100%}
.favbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.favbox label{flex-basis:100%;color:var(--muted);font-size:13px}
.favbox select{flex:1}

.rows{list-style:none;margin:0;padding:0}
.rows li{border-top:1px solid var(--line)}
.row{width:100%;display:grid;grid-template-columns:52px auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:9px 0}
.row .t{font:600 15px/1.1 var(--ui)}
.row .t small{display:block;font-weight:600;font-size:12px}
.row .d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .g{color:var(--muted);font-size:13px;white-space:nowrap}
.row.gone{opacity:.45;text-decoration:line-through}
.stops .srow{width:100%;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;padding:9px 0;align-items:baseline;text-align:left;background:none;border:0;border-radius:0}
.stops li.past .srow{color:var(--muted)}
.stops li.next .srow{font-weight:600}
.row.cur{background:color-mix(in srgb,var(--focus) 14%,transparent)}
.sub{margin:2px 0 -4px;font:600 12px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stops .g{color:var(--muted);font-size:13px}
.bsec{display:flex;flex-direction:column;gap:6px}
.sechead{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;border-top:1px solid var(--line);padding:10px 0 4px;font:600 12px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sechead .caret{transition:transform .15s}
.sechead[aria-expanded="false"] .caret{transform:rotate(-90deg)}
.more{align-self:flex-start}.more:disabled{opacity:.45}
.alerts{display:flex;flex-direction:column;gap:6px}
.alerts>button{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:10px 0 4px;font:600 12px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.alerts>button .caret{transition:transform .15s}
.alerts>button[aria-expanded="false"] .caret{transform:rotate(-90deg)}
.alert{border-left:3px solid var(--focus);padding:2px 0 2px 10px;display:flex;flex-direction:column;gap:2px}
.alert.warn{border-left-color:var(--late)}
.alert p{margin:0}
.alert a{color:var(--focus);font-weight:500}
.hint{color:var(--muted);margin:0}
.fav{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:6px}
.fav .h{display:flex;align-items:center;gap:8px}
.fav .h p{flex:1;min-width:0;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav .h p small{display:block;color:var(--muted)}
.fav .deps{display:flex;flex-wrap:wrap;gap:6px}
.dep{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:600}
.dep small{font-weight:600;margin-left:4px}
.check{display:flex;gap:8px;align-items:center}

nav{position:relative;z-index:600;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;padding:11px 4px 10px;font-weight:500;color:var(--muted);border-top:3px solid transparent}
nav button[aria-current="true"]{color:var(--fg);border-top-color:var(--fg)}
/* Handy: Detailblatt in drei Stufen (kompakt, halb, voll) per Ziehgriff; solange es offen ist, geben Filterleiste und Statuszeile der Karte den Platz zurück */
.sheet .grab{display:none}
@media not all and (min-width:900px) and (min-height:520px) and (orientation:landscape){
  .sheet{transition:max-height .22s ease}
  .sheet[data-snap=peek]{max-height:max(34dvh,190px)}
  .sheet[data-snap=full]{max-height:88dvh}
  .sheet .grab{display:block;width:100%;height:22px;margin:0;padding:0;background:none;border:0;touch-action:none;flex:none}
  .sheet .grab span{display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 0}
  .sheet header{padding-top:2px}
  #app:has(.sheet:not([hidden])) .chips,#app:has(.sheet:not([hidden])) .status{display:none}
}
/* Notebook und iPad im Querformat: Detailblatt rechts neben der Karte statt darunter, damit die Karte die volle Höhe behält */
@media (min-width:900px) and (min-height:520px) and (orientation:landscape){
  #app{display:grid;grid-template-columns:minmax(0,1fr) clamp(360px,34vw,460px);grid-template-rows:minmax(0,1fr) auto}
  #map,.top{grid-column:1/-1;grid-row:1}
  nav{grid-column:1/-1;grid-row:2}
  .sheet{grid-column:2;grid-row:1;max-height:none;min-height:0;border-top:0;border-left:1px solid var(--line);box-shadow:-6px 0 18px rgba(0,0,0,.14)}
  #app:has(.sheet:not([hidden])) #map,#app:has(.sheet:not([hidden])) .top{grid-column:1}
  .top .bar{max-width:560px}
  .badge{max-width:30vw}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="bar">
      <div class="stwrap"><button class="station" id="stationBtn" type="button"><small>Mein Bahnhof</small><b id="stationName">wählen</b></button><button class="stx" id="stationClear" type="button" aria-label="Bahnhof zurücksetzen" hidden>×</button></div>
      <button class="icon" id="locBtn" type="button" aria-label="Karte auf meinen Standort zentrieren">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
      </button>
    </div>
    <div class="chips" id="chips">
      <button class="chip" id="typeBtn" type="button" aria-haspopup="true" aria-expanded="false"><span id="typeTxt">Typen</span> ▾</button>
      <input class="lineq" id="lineQ" type="search" placeholder="Linie, z. B. ICE 774" enterkeyhint="search" autocomplete="off" aria-label="Nach Linie oder Zugnummer filtern">
    </div>
    <div class="menu" id="menu" hidden></div>
    <div class="status num" id="status" role="status">Lade Züge …</div>
    <div class="news" id="news" hidden><button id="newsOpen" type="button"></button><button class="nx" id="newsX" type="button" aria-label="Hinweis schließen">×</button></div>
    <div class="track" id="track" hidden><button class="tbtn" id="trackOpen" type="button" aria-label="Verfolgten Zug anzeigen"></button><button class="tstop" id="trackStop" type="button" aria-label="Verfolgung beenden">×</button></div>
  </div>

  <div id="map"></div>

  <section class="sheet" id="sheet" hidden data-snap="half">
    <button class="grab" id="shGrab" type="button" aria-label="Blatt größer oder kleiner machen"><span></span></button>
    <header><span class="badge" id="shBadge" hidden></span><h2 id="shTitle"></h2><button class="x" id="shClose" type="button">Schließen</button></header>
    <div class="body" id="shBody"></div>
  </section>

  <nav>
    <button type="button" data-tab="map" aria-current="true">Karte</button>
    <button type="button" data-tab="dep">Abfahrten</button>
    <button type="button" data-tab="fav">Meine Linien</button>
  </nav>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script>
/* ===== PURE ===== */
const CATS={
  fern:{label:'Fernverkehr',modes:['HIGHSPEED_RAIL','LONG_DISTANCE','NIGHT_RAIL']},
  regio:{label:'Regional',modes:['REGIONAL_RAIL','REGIONAL_FAST_RAIL']},
  sbahn:{label:'S-Bahn',modes:['SUBURBAN','METRO']},
  stadt:{label:'Tram · U · Bus',modes:['TRAM','SUBWAY','BUS','COACH','FERRY','FUNICULAR']}
};
const CAT_ORDER=['fern','regio','sbahn','stadt'];
function catOf(mode){for(const k of CAT_ORDER)if(CATS[k].modes.includes(mode))return k;return 'stadt';}
function decodePolyline(str,precision){
  const f=Math.pow(10,precision==null?5:precision),out=[];let i=0,lat=0,lon=0;
  while(i<str.length){
    for(const which of [0,1]){
      let r=0,s=0,b;
      do{b=str.charCodeAt(i++)-63;r|=(b&31)<<s;s+=5;}while(b>=32&&i<str.length);
      const d=(r&1)?~(r>>1):(r>>1);
      if(which===0)lat+=d;else lon+=d;
    }
    out.push([lat/f,lon/f]);
  }
  return out;
}
function dist(a,b){const k=Math.cos((a[0]+b[0])*Math.PI/360);const dy=(a[0]-b[0])*111320,dx=(a[1]-b[1])*111320*k;return Math.sqrt(dx*dx+dy*dy);}
function cumulative(coords){const c=[0];for(let i=1;i<coords.length;i++)c.push(c[i-1]+dist(coords[i-1],coords[i]));return c;}
/* Punkt bei Anteil f (0..1) zwischen den Stützpunkten i0 und i1 einer Linie */
function pointAlong(coords,cum,i0,i1,f){
  if(!coords.length)return null;
  i0=Math.max(0,Math.min(coords.length-1,i0));i1=Math.max(i0,Math.min(coords.length-1,i1));
  f=Math.max(0,Math.min(1,f));
  const target=cum[i0]+(cum[i1]-cum[i0])*f;
  let j=i0;while(j<i1&&cum[j+1]<target)j++;
  if(j>=i1)return coords[i1];
  const seg=cum[j+1]-cum[j],t=seg>0?(target-cum[j])/seg:0;
  return [coords[j][0]+(coords[j+1][0]-coords[j][0])*t,coords[j][1]+(coords[j+1][1]-coords[j][1])*t];
}
function nearestIndex(coords,p,from){let best=from,bd=Infinity;for(let j=from;j<coords.length;j++){const d=dist(coords[j],p);if(d<bd){bd=d;best=j;}}return best;}
function ms(s){const t=Date.parse(s);return isNaN(t)?null:t;}
function delayMin(real,sched){return(real==null||sched==null)?0:Math.round((real-sched)/60000);}

/* Position eines Zuges aus seinen Abschnitten (map/trips) zum Zeitpunkt now */
function segmentPosition(segs,now){
  let cur=null;
  for(const s of segs){if(s.dep<=now)cur=s;}
  if(!cur)return{pos:segs[0].coords[0],seg:segs[0],state:'wait'};
  const span=cur.arr-cur.dep,f=span>0?(now-cur.dep)/span:1;
  const pos=pointAlong(cur.coords,cur.cum,0,cur.coords.length-1,f);
  return{pos,seg:cur,state:f>=1?'stop':'run'};
}
/* Position des verfolgten Zuges aus dem ganzen Fahrtverlauf (trip) */
function tripPosition(trip,now){
  const st=trip.stops,n=st.length;
  if(!n)return null;
  const first=st[0].dep??st[0].arr;
  if(now<first)return{pos:st[0].ll,state:'wait',i:0};
  for(let i=0;i<n;i++){
    const a=st[i].arr??st[i].dep,d=st[i].dep??st[i].arr;
    if(now>=a&&now<=d)return{pos:st[i].ll,state:'stop',i};
    if(i<n-1){
      const na=st[i+1].arr??st[i+1].dep;
      if(now>d&&now<na){
        const f=(now-d)/(na-d);
        const pos=trip.coords.length>1?pointAlong(trip.coords,trip.cum,st[i].idx,st[i+1].idx,f)
          :[st[i].ll[0]+(st[i+1].ll[0]-st[i].ll[0])*f,st[i].ll[1]+(st[i+1].ll[1]-st[i].ll[1])*f];
        return{pos,state:'run',i};
      }

  }

}
/* Ab welcher Zoomstufe eine Zuggattung angezeigt wird: Fernverkehr ganzes Land, Regional Bundesland, S-Bahn Region, Tram/Bus Stadt.
   Große Bildschirme zeigen bei gleicher Zoomstufe mehr Fläche, die Schwelle steigt dann mit (Referenz: 390 px breit). */
const MIN_ZOOM={fern:5,regio:8,sbahn:9,stadt:11};
function minZoom(cat,widthPx){return MIN_ZOOM[cat]+Math.round(Math.max(0,Math.log2(Math.max(widthPx||390,390)/390))*2)/2;}
/* Überlappende Zugnamen ausblenden: Reihenfolge = Priorität. fixed = bereits belegte Kästchen (z. B. verfolgter Zug).
   Liefert pro Eintrag, ob er angezeigt wird. Kästchen sind mittig um (x,y), Breite w, Höhe h. */
function declutter(items,fixed){
  const boxes=(fixed||[]).slice(),out=[];
  for(const it of items){
    const hit=boxes.some(b=>Math.abs(b.x-it.x)*2<b.w+it.w&&Math.abs(b.y-it.y)*2<b.h+it.h);
    out.push(!hit);if(!hit)boxes.push(it);

const boxW=name=>10+7*String(name||'').length;
/* Teilt den Laufweg wie ein Navi in „gefahren“ und „voraus“ am aktuellen Standort */
function routeSplit(trip,now){
  const st=trip.stops,tp=tripPosition(trip,now);if(!tp)return null;
  const line=trip.coords.length>1?trip.coords:st.map(s=>s.ll);
  const cum=trip.coords.length>1?trip.cum:cumulative(line);
  const at=s=>trip.coords.length>1?cum[s.idx]:cum[st.indexOf(s)];
  let target;
  if(tp.state==='wait')target=0;
  else if(tp.state==='done')target=cum[cum.length-1];
  else if(tp.state==='stop')target=at(st[tp.i]);
  else{const a=at(st[tp.i]),b=at(st[tp.i+1]);const d=st[tp.i].dep??st[tp.i].arr,n=st[tp.i+1].arr??st[tp.i+1].dep;target=a+(b-a)*Math.max(0,Math.min(1,(now-d)/(n-d)));}
  let j=0;while(j<cum.length-2&&cum[j+1]<=target)j++;
  const done=line.slice(0,j+1).concat([tp.pos]),ahead=[tp.pos].concat(line.slice(j+1));

/* Durchschnittsgeschwindigkeit (km/h) zwischen Halt i und i+1 aus Strecke und Echtzeit-Fahrzeit */
function legSpeed(trip,i){
  const st=trip.stops;if(i<0||i>=st.length-1)return null;
  const a=st[i],b=st[i+1],t0=a.dep??a.arr,t1=b.arr??b.dep;
  if(t0==null||t1==null||t1<=t0)return null;
  const m=trip.coords.length>1&&b.idx>a.idx?trip.cum[b.idx]-trip.cum[a.idx]:dist(a.ll,b.ll);

    const b=String(x).toLowerCase().split('-')[0];

function wantCity(ll){

    const m=(r||[])[0],a=m&&((m.areas||[]).find(x=>x.default)||(m.areas||[])[0]);

/* Halte: gefahrene grau, kommende in Linienfarbe, angetippter Halt groß */
function paintStopDots(){
  if(!route)return;
  const i=state.sel?state.sel.stopI:null,nx=route.next??0;
  stopDots.forEach((d,k)=>{
    const past=k<nx,st=k===i?{radius:9,weight:4}:k===nx?{radius:7,weight:3}:{radius:5,weight:2};

/* Navi-Ansicht: Strecke voraus kräftig, gefahrener Teil grau, nächster Halt und Ziel beschriftet */
function paintRoute(force){
  const sel=state.sel;if(!route||!sel||!sel.trip)return;
  const r=routeSplit(sel.trip,Date.now());if(!r)return;
  if(force||route.target==null||Math.abs(r.target-route.target)>10||r.next!==route.next){
    route.done.setLatLngs(r.done);route.ahead.setLatLngs(r.ahead);route.casing.setLatLngs(r.ahead);
    route.target=r.target;
    const nextChanged=r.next!==route.next;route.next=r.next;
    if(nextChanged||force)paintStopDots();
  }
  const st=sel.trip.stops,last=st.length-1,nx=r.next;
  const want=[];
  if(nx<last)want.push([nx,st[nx].name+' '+hhmm(st[nx].arr??st[nx].dep),false]);
  want.push([last,'Ziel '+st[last].name+' '+hhmm(st[last].arr??st[last].dep),true]);
  for(const[k,tt]of route.labels)if(!want.some(w=>w[0]===k)){stopLayer.removeLayer(tt);route.labels.delete(k);}
  for(const[k,txt,dest]of want){
    let tt=route.labels.get(k);
    if(!tt){
      tt=L.tooltip({permanent:true,direction:'auto',offset:[10,0],className:'rlab'+(dest?' dest':''),interactive:false})
        .setLatLng(st[k].ll).setContent(txt);

async function api(path,params,signal){
  const u=new URL(API+path);
  if(LANG_PATH.test(path)&&!('language' in params))params={...params,language:LANGS.join(',')};
  for(const[k,v]of Object.entries(params))if(v!=null&&v!=='')u.searchParams.set(k,v);
  const ctl=new AbortController();let timedOut=false;
  const timer=setTimeout(()=>{timedOut=true;ctl.abort();},45000);
  if(signal)signal.addEventListener('abort',()=>ctl.abort());
  try{
    const r=await fetch(u,{signal:ctl.signal,headers:{accept:'application/json'}});
    if(!r.ok)throw new Error(r.status===429?'zu viele Anfragen (429)':'Serverfehler '+r.status);
    return await r.json();
  }catch(e){
    if(timedOut)throw new Error('Zeitüberschreitung');
    if(e.name==='TypeError')throw new Error('keine Verbindung');
    throw e;
  }finally{clearTimeout(timer);}
}

/* ---------- Züge im Kartenausschnitt ---------- */
let tripsCtl=null,retryTimer=null,loading=false,loadedZoom=null;
function parseTrips(data,prec){
  const next=new Map();
  for(const s of(Array.isArray(data)?data:[])){
    const info=(s.trips||[])[0];if(!info||!s.polyline)continue;
    const coords=decodePolyline(s.polyline,prec);if(!coords.length)continue;
    const names=[...new Set((s.trips||[]).map(t=>t.displayName||t.routeShortName).filter(Boolean))];
    const dep=ms(s.departure),arr=ms(s.arrival);if(dep==null||arr==null)continue;
    let t=next.get(info.tripId);
    if(!t){t={id:info.tripId,name:names.join(' / ')||'Zug',cat:catOf(s.mode),mode:s.mode,segs:[]};next.set(info.tripId,t);}
    t.segs.push({dep,arr,sdep:ms(s.scheduledDeparture),sarr:ms(s.scheduledArrival),rt:!!s.realTime,
      from:s.from&&s.from.name,to:s.to&&s.to.name,coords,cum:cumulative(coords)});
  }
  for(const t of next.values())t.segs.sort((a,b)=>a.dep-b.dep);

}
const precFor=z=>z>=11?5:z>=8?4:3;
/* Gattung eingeschaltet UND bei diesem Zoom/Bildschirm sinnvoll? */
const catAllowed=c=>map.getZoom()>=minZoom(c,map.getSize().x);

async function loadTrips(force){
  if(document.hidden)return;
  if(loading&&!force)return;
  if(tripsCtl)tripsCtl.abort();
  const z=map.getZoom(),need=CAT_ORDER.filter(catShown);
  /* Nichts Passendes für diesen Ausschnitt: gar nicht erst anfragen (spart Daten und schont die Schnittstelle) */
  if(!need.length){
    loading=false;clearTimeout(retryTimer);state.trips=new Map();state.err=null;state.lastOk=Date.now();loadedZoom=z;
    render();paintChips();return;
  }
  const my=new AbortController();tripsCtl=my;loading=true;
  const b=map.getBounds(),now=Date.now();loadedZoom=z;
  if(!state.lastOk&&!state.err)setStatus('Lade Züge …');
  try{
    /* Ist nur Fernverkehr gefragt, fordert die Schnittstelle bei höherem Zoom trotzdem nur Fernzüge an */
    const zoomParam=need.every(c=>c==='fern')&&need.length?Math.min(z,MIN_ZOOM.regio-3):z;
    const data=await api('/api/v6/map/trips',{
      min:b.getSouth().toFixed(5)+','+b.getEast().toFixed(5),
      max:b.getNorth().toFixed(5)+','+b.getWest().toFixed(5),
      startTime:new Date(now-30000).toISOString(),endTime:new Date(now+150000).toISOString(),
      zoom:zoomParam,precision:precFor(z)
    },my.signal);
    state.trips=parseTrips(data,precFor(z));state.lastOk=Date.now();state.err=null;failCount=0;
    render();paintChips();
  }catch(e){
    if(my.signal.aborted)return;
    /* Bei Fehlern (auch „zu viele Anfragen“) länger warten statt die Schnittstelle weiter zu bedrängen */
    failCount++;
    const wait=Math.min(120,/429/.test(e.message||'')?Math.max(60,10*2**(failCount-1)):10*2**(failCount-1));
    state.err='Zugtracker: '+(e.message||'Fehler')+'. Neuer Versuch in '+wait+' s.';
    setStatus(state.err,true);

function note(text,err,ms){state.note={text,err:!!err,until:Date.now()+ms};setStatus(text,!!err);}
function passes(t){

  /* Dieselbe Zugnummer kommt oft doppelt aus verschiedenen Fahrplanquellen (einmal mit, einmal ohne Echtzeit).

  const cand=[];

    c.x=pt.x;c.y=pt.y;c.w=boxW(c.t.name);c.h=22;vis.push(c);
  }
  vis.sort((a,b)=>(prevShown.has(a.t.id)?0:1)-(prevShown.has(b.t.id)?0:1)||CAT_ORDER.indexOf(a.t.cat)-CAT_ORDER.indexOf(b.t.cat)||(b.p.seg.rt?1:0)-(a.p.seg.rt?1:0));
  const fixed=[];
  if(state.sel&&state.sel.lastPos){const sp=map.latLngToContainerPoint(state.sel.lastPos);fixed.push({x:sp.x,y:sp.y,w:boxW(state.sel.name),h:22});}
  const keep=declutter(vis,fixed),drawn=vis.filter((c,i)=>keep[i]);
  hiddenCount=vis.length-drawn.length;prevShown=new Set(drawn.map(c=>c.t.id));
  for(const{t,p}of drawn){
    if(shown>=350)break;
    seen.add(t.id);shown++;
    const ic=iconFor(t,p.seg,false,p.state!=='run');
    let m=markers.get(t.id);
    if(!m){
      m=L.marker(p.pos,{icon:ic.make(),keyboard:false}).addTo(map);
      m._meta={name:t.name,cat:t.cat};m.on('click',()=>onMarker(t.id,m));m._k=ic.key;markers.set(t.id,m);
    }else{
      m.setLatLng(p.pos);

    }
  }
  /* Der verfolgte Zug hängt nie vom Kartenausschnitt, Zoom oder Filter ab */
  const sel=state.sel;
  if(sel){
    const t=state.trips.get(sel.id);

    let pos=null,seg=null;
    if(sel.trip){const tp=tripPosition(sel.trip,now);if(tp)pos=tp.pos;}
    if(sel.segs&&sel.segs.length){const p=segmentPosition(sel.segs,now);seg=p.seg;if(!pos)pos=p.pos;}
    if(pos)sel.lastPos=pos;else pos=sel.lastPos;
    if(pos){
      const ic=iconFor({name:sel.name,cat:sel.cat},seg||{rt:!!(sel.trip&&sel.trip.rt),arr:0,sarr:0},true);
      let m=markers.get(sel.id);
      if(!m){m=L.marker(pos,{icon:ic.make(),keyboard:false,zIndexOffset:1000}).addTo(map);m._meta={name:sel.name,cat:sel.cat};m.on('click',()=>onMarker(sel.id,m));m._k=ic.key;markers.set(sel.id,m);}
      else{m.setLatLng(pos);if(m._k!==ic.key){m.setIcon(ic.make());m._k=ic.key;m.setZIndexOffset(1000);}}
      seen.add(sel.id);shown++;
    }
  }
  for(const[id,m]of markers)if(!seen.has(id)){map.removeLayer(m);markers.delete(id);}
  if(state.lastOk){
    const age=Math.round((now-state.lastOk)/1000);
    let txt='Stand '+new Date(state.lastOk).toLocaleTimeString('de-DE')+' · '+shown+(shown===1?' Zug':' Züge');
    const far=farCats();
    if(far.length)txt+=' · näher heranzoomen für '+far.map(c=>CATS[c].label).join(', ');
    else if(hiddenCount>0)txt+=' · '+hiddenCount+' ausgeblendet, näher heranzoomen';
    if(state.query&&!list.length)txt='Kein Zug „'+state.queryRaw+'“ im Ausschnitt. Enter sucht im ganzen Netz.';
    if(state.note&&Date.now()<state.note.until)setStatus(state.note.text,state.note.err);
    else if(age<70&&!state.err)setStatus(txt,false);
  }
  if(state.sel&&state.sel.follow){
    const m=markers.get(state.sel.id);
    if(m&&!zoomBusy)map.panTo(m.getLatLng(),{animate:true,duration:.8});
  }
  paintRoute();
  if(state.sheet==='trip')renderTripStatus();
  paintTrack();
}

async function loadTrip(){

  try{
    const it=await api('/api/v6/trip',{tripId:sel.id});
    if(state.sel!==sel)return;
    const legs=(it.legs||[]).filter(l=>l.from&&l.to);
    const stops=[],coords=[],rawAlerts=[];let rt=false,cancelled=false;
    for(const l of legs){
      rt=rt||!!l.realTime;cancelled=cancelled||!!l.cancelled;rawAlerts.push(l.alerts);
      for(const p of[l.from,...(l.intermediateStops||[]),l.to]){
        const last=stops[stops.length-1];
        const s={name:p.name,raw:p.name,id:p.stopId,ll:[p.lat,p.lon],arr:ms(p.arrival),dep:ms(p.departure),
          sarr:ms(p.scheduledArrival),sdep:ms(p.scheduledDeparture),track:p.track||p.scheduledTrack||'',cancelled:!!p.cancelled,alerts:p.alerts||[]};
        rawAlerts.push(p.alerts);

      }

    if(!stops.length)throw new Error('leer');

    for(const s of stops){s.idx=coords.length?nearestIndex(coords,s.ll,from):0;from=s.idx;}
    sel.trip={stops,coords,cum:cumulative(coords),rt,cancelled,dest:'',alerts:parseAlerts(...rawAlerts)};applyNames(sel.trip);
    if(routeLine)map.removeLayer(routeLine);

    const done=L.polyline([],{color:grey,weight:4,opacity:.5,dashArray:'2 7',lineCap:'round',interactive:false});
    const casing=L.polyline([],{color:fill,weight:10,opacity:.9,lineCap:'round',lineJoin:'round',interactive:false});
    const ahead=L.polyline([],{color:css,weight:6,opacity:1,lineCap:'round',lineJoin:'round',interactive:false});
    routeLine=L.layerGroup([done,casing,ahead]).addTo(map);
    stopLayer=L.layerGroup().addTo(map);stopDots=[];stopHits=[];

      stopHits.push(L.circleMarker(st.ll,{radius:16,stroke:false,fillColor:css,fillOpacity:.01,bubblingMouseEvents:false}).on('click',()=>showStop(i)).addTo(stopLayer));

    renderTripSheet();render();
  }catch(e){
    if(state.sel===sel&&!sel.trip){
      if(state.sheet==='trip')$('shBody').replaceChildren(el('p','hint','Der Fahrtverlauf lässt sich gerade nicht laden ('+(e.message||'Fehler')+'). Der Zug bleibt auf der Karte, neuer Versuch in 8 s.'));

}

/* ---------- Hinweise zu Störungen und Sperrungen (so wie Transitous sie liefert) ---------- */
function parseAlerts(...lists){
  const out=[],seen=new Set(),now=Date.now();
  for(const a of lists.flat(Infinity)){
    if(!a||typeof a!=='object')continue;
    const head=String(a.headerText||'').trim(),text=String(a.descriptionText||'').trim();
    if(!head&&!text)continue;
    const per=(a.impactPeriod||[]).map(r=>[ms(r.start),ms(r.end)]);
    if(per.length&&!per.some(([,e])=>e==null||e>=now))continue;
    const key=head+'|'+text;if(seen.has(key))continue;seen.add(key);
    out.push({head,text:text.slice(0,700),url:/^https?:\/\//i.test(a.url||'')?a.url:'',
      warn:a.severityLevel==='SEVERE'||a.severityLevel==='WARNING'||a.effect==='NO_SERVICE'||a.effect==='DETOUR',
      cur:per.some(([s,e])=>(s==null||s<=now)&&(e==null||e>now))});
  }
  return out.sort((x,y)=>(y.warn?1:0)-(x.warn?1:0));
}
const alertOpen={};
function alertsEl(list,key,rerender){
  if(!list.length)return null;
  const open=alertOpen[key]!==undefined?alertOpen[key]:list.some(a=>a.warn||a.cur);
  const box=el('section','alerts');box.id='al-'+key;
  const h=el('button');h.type='button';h.setAttribute('aria-expanded',String(open));
  h.append(el('span',null,'⚠ Hinweise ('+list.length+')'),el('span','caret','▾'));
  h.onclick=()=>{alertOpen[key]=!open;rerender();};
  box.appendChild(h);
  if(open)for(const a of list){
    const d=el('div','alert'+(a.warn?' warn':''));
    if(a.head)d.appendChild(el('b',null,a.head));
    if(a.text&&a.text!==a.head)d.appendChild(el('p',null,a.text));
    if(a.url){const l=el('a',null,'Mehr Informationen');l.href=a.url;l.target='_blank';l.rel='noopener noreferrer';d.appendChild(l);}
    box.appendChild(d);
  }
  return box;
}

/* ---------- Bahnhöfe auf der freien Karte ---------- */
/* Haltestellen kommen erst ab ST_MIN_RAIL (nur Bahn) bzw. ST_MIN_ALL (auch Tram, U-Bahn, Bus) und nur für den sichtbaren Ausschnitt. */
const ST_MIN_RAIL=10,ST_MIN_ALL=14,ST_MAX=250;
let stLayer=null,stCtl=null,stTimer=null,stPause=0,stKey='';const stMarks=new Map();
function stationModes(z){
  const m=[];
  for(const c of state.cats){
    if(c==='stadt'&&z<ST_MIN_ALL)continue;
    for(const x of CATS[c].modes)if(x!=='REGIONAL_FAST_RAIL'&&x!=='METRO')m.push(x);
  }
  return m;
}
function clearStations(){
  if(stCtl)stCtl.abort();stKey='';
  if(stLayer)stLayer.clearLayers();stMarks.clear();
}
async function loadStations(){
  const z=map.getZoom(),modes=stationModes(z);
  if(z<ST_MIN_RAIL||!modes.length||document.hidden){clearStations();return;}
  if(Date.now()<stPause)return;
  const b=map.getBounds().pad(.1),r2=x=>x.toFixed(2);
  const key=[z,modes.join(),r2(b.getSouth()),r2(b.getWest()),r2(b.getNorth()),r2(b.getEast())].join('|');
  if(key===stKey)return;
  if(stCtl)stCtl.abort();stCtl=new AbortController();const ctl=stCtl;
  try{
    const list=await api('/api/v6/map/stops',{min:b.getSouth()+','+b.getWest(),max:b.getNorth()+','+b.getEast(),modes:modes.join(','),grouped:'true',language:LANGS.join(',')},ctl.signal);
    if(ctl.signal.aborted)return;
    stKey=key;
    paintStations((Array.isArray(list)?list:[]).filter(s=>s&&s.stopId&&s.lat!=null&&s.lon!=null));
  }catch(e){
    if(ctl.signal.aborted)return;
    stPause=Date.now()+(/429/.test(e.message)?60000:20000);
  }
}
function paintStations(list){
  if(!stLayer)stLayer=L.layerGroup().addTo(map);
  list.sort((a,c)=>(c.importance||0)-(a.importance||0));
  const keep=new Set(list.slice(0,ST_MAX).map(s=>s.stopId));
  for(const[id,g]of stMarks)if(!keep.has(id)){stLayer.removeLayer(g);stMarks.delete(id);}
  const line=cssVar('--fg'),fill=cssVar('--surface');
  for(const s of list.slice(0,ST_MAX)){
    if(stMarks.has(s.stopId))continue;
    const ll=[s.lat,s.lon],stop={id:s.stopId,name:s.name,lat:s.lat,lon:s.lon};
    const g=L.layerGroup([
      L.circleMarker(ll,{radius:5,weight:2,color:line,fillColor:fill,fillOpacity:1,interactive:false}),
      L.circleMarker(ll,{radius:17,stroke:false,fillColor:line,fillOpacity:.01,bubblingMouseEvents:false}).on('click',()=>openBoard(stop))
    ]);
    stLayer.addLayer(g);stMarks.set(s.stopId,g);
  }
}

/* ---------- Bahnhofstafel: Abfahrten und Ankünfte, je 5, vor und zurück ---------- */
const board={stop:null,dep:null,arr:null},boardOpen=store.get('boardOpen',{dep:true,arr:true});
const newSec=()=>({items:[],busy:false,err:false,endEarly:false,endLate:false});
async function fetchBoard(stop,kind,o){
  const p={stopId:stop.id,center:stop.lat+','+stop.lon,radius:300,n:5,mode:activeModes()||undefined};
  if(kind==='arr')p.arriveBy='true';
  if(o.dir)p.direction=o.dir;else if(kind==='arr')p.direction='LATER';
  if(o.time!=null)p.time=new Date(o.time).toISOString();
  const r=await api('/api/v6/stoptimes',p);
  return(r.stopTimes||[]).map(s=>{
    const pl=s.place||{},far=kind==='arr'?s.tripFrom:s.tripTo;
    const t=ms(kind==='arr'?(pl.arrival||pl.departure):(pl.departure||pl.arrival)),st=ms(kind==='arr'?(pl.scheduledArrival||pl.scheduledDeparture):(pl.scheduledDeparture||pl.scheduledArrival));
    return{id:s.tripId,name:s.displayName||s.routeShortName||s.tripShortName||'Zug',cat:catOf(s.mode),
      dest:(far&&far.name)||(kind==='dep'?s.headsign:'')||'',destLL:far&&far.lat!=null?[far.lat,far.lon]:null,
      dep:t,sdep:st,track:pl.track||pl.scheduledTrack||'',rt:!!s.realTime,cancelled:!!(s.cancelled||s.tripCancelled),alerts:pl.alerts||[]};
  }).filter(d=>d.dep!=null);
}
async function loadBoard(kind,dir){
  const b=board,sec=b[kind];if(!b.stop||!sec||sec.busy)return;
  const stop=b.stop,first=sec.items[0],last=sec.items[sec.items.length-1];
  const o=dir==='EARLIER'?{dir,time:first&&first.dep}:dir==='LATER'?{dir,time:last&&last.dep+60000}:{};
  sec.busy=true;sec.err=false;renderBoard();
  try{
    let got=await fetchBoard(stop,kind,o);
    if(board.stop!==stop)return;
    const now=Date.now();
    if(!dir)got=got.filter(d=>d.dep>=now-120000);
    if(dir==='EARLIER')got=got.filter(d=>d.dep<=first.dep);
    if(dir==='LATER')got=got.filter(d=>d.dep>=last.dep);
    const have=new Set(sec.items.map(d=>d.id+'|'+d.dep)),add=got.filter(d=>!have.has(d.id+'|'+d.dep));
    if(dir==='EARLIER'&&!add.length)sec.endEarly=true;
    if(dir==='LATER'&&!add.length)sec.endLate=true;
    sec.items=sec.items.concat(add).sort((a,c)=>a.dep-c.dep);
  }catch(e){if(board.stop===stop)sec.err=true;}
  if(board.stop===stop){sec.busy=false;renderBoard();}
}
function openBoard(stop){
  board.stop=stop;board.dep=newSec();board.arr=newSec();
  map.setView([stop.lat,stop.lon],Math.max(map.getZoom(),13));
  openSheet('board');
  loadBoard('dep');loadBoard('arr');
}

  const place=placeName(d.dest,d.destLL),txt=(d.alerts&&d.alerts.length?'⚠ ':'')+(kind==='arr'?'von ':'nach ')+place+(d.cancelled?' (fällt aus)':'');

function boardSection(kind,label){
  const sec=board[kind],open=boardOpen[kind]!==false,wrap=el('section','bsec');
  const head=el('button','sechead');head.type='button';head.id='bh-'+kind;head.setAttribute('aria-expanded',String(open));

const SNAPS=['peek','half','full'];
function setSnap(sn){$('sheet').dataset.snap=sn;map.invalidateSize();setTimeout(()=>map.invalidateSize(),260);}
(()=>{
  const g=$('shGrab');let y0=null,moved=false;
  g.addEventListener('pointerdown',e=>{y0=e.clientY;moved=false;try{g.setPointerCapture(e.pointerId)}catch(_){}});
  g.addEventListener('pointermove',e=>{if(y0!=null&&Math.abs(e.clientY-y0)>8)moved=true;});
  g.addEventListener('pointerup',e=>{
    if(y0==null)return;const dy=y0-e.clientY;y0=null;
    const i=SNAPS.indexOf($('sheet').dataset.snap);
    if(!moved)setSnap(SNAPS[(i+1)%3]);
    else setSnap(SNAPS[Math.max(0,Math.min(2,i+(dy>0?1:-1)))]);
  });
  g.addEventListener('pointercancel',()=>{y0=null;});
})();

/* ---------- Was ist neu (liest CHANGELOG.md aus dem Repo) ---------- */
/* Format: „## Datum“ als Überschrift, darunter „- Eintrag“. Alles andere wird ignoriert. */
function parseChangelog(md){
  const out=[];let cur=null;
  for(const line of String(md).split(/\r?\n/)){
    const h=line.match(/^##\s+(.+?)\s*$/);
    if(h){cur={v:h[1],items:[]};out.push(cur);continue;}
    const it=line.match(/^\s*[-*]\s+(.+?)\s*$/);
    if(it&&cur)cur.items.push(it[1]);
  }
  return out.filter(e=>e.items.length);
}
let news=null;
async function loadNews(){
  try{
    const r=await fetch('CHANGELOG.md',{cache:'no-cache'});if(!r.ok)return;
    news=parseChangelog(await r.text());if(!news.length)return;
    const seen=store.get('news',null),latest=news[0].v;
    /* Erstbesuch: kein Hinweis. Wer schon Einstellungen hat, kannte die Seite vor dem Änderungsprotokoll. */
    if(seen==null&&!['station','favs','cats'].some(k=>store.get(k,null)!=null)){store.set('news',latest);return;}
    if(seen===latest)return;
    const fresh=seen==null?news.slice(0,1):news.filter(e=>e.v>seen);
    const first=(fresh[0]||news[0]).items[0];
    const n=fresh.reduce((a,e)=>a+e.items.length,0);
    const b=$('newsOpen');b.replaceChildren(el('b',null,'Neu: '),first+(n>1?' (+'+(n-1)+')':''));
    $('news').hidden=false;
  }catch(e){}
}
function markNewsSeen(){if(news&&news.length)store.set('news',news[0].v);$('news').hidden=true;}
function renderNews(){
  $('shTitle').textContent='Was ist neu';
  const body=$('shBody');body.replaceChildren();
  if(!news||!news.length){body.appendChild(el('p','hint','Die Liste der Neuerungen lässt sich gerade nicht laden.'));return;}
  const box=el('div','newsbox');
  for(const e of news){
    const d=/^\d{4}-\d{2}-\d{2}$/.test(e.v)?new Date(e.v+'T12:00:00').toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'}):e.v;
    box.appendChild(el('h3',null,d));
    const ul=el('ul');for(const it of e.items)ul.appendChild(el('li',null,it));box.appendChild(ul);
  }
  body.appendChild(box);markNewsSeen();
}

        'GitHub Pages: liefert diese Seite aus und führt eigene Zugriffsprotokolle']),
    p('Alle diese Dienste sehen außerdem, von welcher Seite die Anfrage kommt (squaredp.github.io, ohne Pfad). OpenRailwayMap verlangt das.'),
    p('Dein Standort wird nur abgefragt, wenn du den Standortknopf tippst. Er bleibt im Browser. Weil die Karte dorthin springt, geht danach der sichtbare Kartenausschnitt an Transitous.'));
  sec('Fehler oder Wünsche?',
    (()=>{const q=p('Bitte als ');q.append(link('Issue auf GitHub','https://github.com/SquaredP/zugradar/issues'),' melden.');return q;})());
  body.appendChild(box);
}
$('newsOpen').onclick=()=>openSheet('news');
$('newsX').onclick=markNewsSeen;
loadNews();

/* ---------- Filter ---------- */
function paintChips(){
  const n=state.cats.size,k=CAT_ORDER.length;
  $('typeTxt').textContent=(n===k?'Alle Typen':n?n+' von '+k+' Typen':'Keine Typen')+(state.standing?' + stehende':'');
  if(menuOpen)renderMenu();
}
let menuOpen=false;
function closeMenu(){menuOpen=false;$('menu').hidden=true;$('typeBtn').setAttribute('aria-expanded','false');}
function renderMenu(){
  const box=$('menu');
  box.replaceChildren(el('h3',null,'Diese Zugtypen zeigen'));
  const all=el('div','all'),a1=el('button',null,'Alle'),a2=el('button',null,'Keine');a1.type=a2.type='button';
  const apply=()=>{store.set('cats',[...state.cats]);paintChips();render();loadTrips(true);clearStations();loadStations();};
  a1.onclick=()=>{state.cats=new Set(CAT_ORDER);apply();};a2.onclick=()=>{state.cats=new Set();apply();};
  all.append(a1,a2);box.appendChild(all);
  for(const k of CAT_ORDER){
    const lab=el('label','c-'+k),cb=el('input'),dot=el('i');cb.type='checkbox';cb.checked=state.cats.has(k);cb.dataset.cat=k;
    cb.onchange=()=>{cb.checked?state.cats.add(k):state.cats.delete(k);apply();};
    lab.append(cb,dot,el('span',null,CATS[k].label));
    if(!catAllowed(k))lab.append(el('small',null,'näher heranzoomen'));
    box.appendChild(lab);
  }
  const lab=el('label'),cb=el('input'),dot=el('i','ring');cb.type='checkbox';cb.checked=state.standing;cb.id='standCb';
  cb.onchange=()=>{state.standing=cb.checked;store.set('standing',state.standing);paintChips();render();};
  lab.append(cb,dot,el('span',null,'Stehende (im Halt)'));
  box.append(el('h3',null,'Zusätzlich'),lab);
}
function toggleMenu(){
  if(menuOpen){closeMenu();return;}
  if(state.sheet)closeSheet();
  menuOpen=true;renderMenu();$('menu').hidden=false;$('typeBtn').setAttribute('aria-expanded','true');
}
document.addEventListener('click',e=>{if(menuOpen&&!e.composedPath().some(n=>n.id==='menu'||n.id==='typeBtn'))closeMenu();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
$('typeBtn').addEventListener('click',toggleMenu);
$('lineQ').addEventListener('input',e=>{state.queryRaw=e.target.value.trim();state.query=norm(e.target.value);render();if(state.sheet==='dep')renderDepartures();});
$('lineQ').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur();findTrain();}});
function showTrain(t){
  state.trips.set(t.id,t);
  const p=segmentPosition(t.segs,Date.now()).pos;
  if(p)map.setView(p,Math.max(map.getZoom(),11));
  selectTrip(t.id,t.name,t.cat);
}
async function findTrain(){
  const q=state.query;if(!q)return;
  let hits=[...state.trips.values()].filter(t=>norm(t.name).includes(q));
  if(!hits.length){
    note('Suche „'+state.queryRaw+'“ im ganzen Netz …',false,60000);
    try{
      const now=Date.now();
      const data=await api('/api/v6/map/trips',{min:'47.2,15.2',max:'55.1,5.8',startTime:new Date(now-30000).toISOString(),endTime:new Date(now+150000).toISOString(),zoom:5,precision:3});
      hits=[...parseTrips(data,3).values()].filter(t=>norm(t.name).includes(q));
    }catch(e){note('Suche nicht möglich: '+(e.message||'Fehler'),true,8000);return;}
    if(!hits.length){note('Kein Zug „'+state.queryRaw+'“ im Netz gefunden. Regional- und Nahverkehr wird nur im Kartenausschnitt gesucht.',true,10000);return;}
    state.note=null;
  }
  if(hits.length===1){showTrain(hits[0]);return;}
  state.found=hits.slice(0,30);setTab('map',true);openSheet('find');
}
function renderFind(){
  $('shTitle').textContent=state.found.length+' Treffer für „'+state.queryRaw+'“';
  const body=$('shBody');body.replaceChildren();
  const ul=el('ul','rows');
  for(const t of state.found){
    const li=el('li'),b=el('button','row');b.type='button';b.style.gridTemplateColumns='auto minmax(0,1fr)';
    b.append(el('span','badge c-'+t.cat,t.name),el('span','d',CATS[t.cat].label));
    b.onclick=()=>showTrain(t);li.appendChild(b);ul.appendChild(li);
  }
  body.appendChild(ul);
}

/* ---------- Standort ---------- */
$('locBtn').onclick=()=>{
  if(!navigator.geolocation){setStatus('Dieser Browser gibt keinen Standort frei.',true);return;}
  navigator.geolocation.getCurrentPosition(p=>{
    const ll=[p.coords.latitude,p.coords.longitude];
    if(meMarker)meMarker.setLatLng(ll);else meMarker=L.marker(ll,{icon:L.divIcon({className:'',html:'<span class="me"></span>',iconSize:[0,0]}),interactive:false}).addTo(map);
    if(state.sel)state.sel.follow=false;
    map.setView(ll,Math.max(map.getZoom(),13));
  },()=>setStatus('Standort nicht verfügbar. Freigabe im Browser prüfen (nur über https).',true),{enableHighAccuracy:true,timeout:10000});
};

/* ---------- Doppeltipp: eine Zoomstufe näher, wie beim Schiffsradar ----------
   Eigene Geste statt Leaflet-Standard: robust gegen die Doppeltipp-Vergrößerung von iOS und gegen das Nachführen beim Verfolgen.
   Maus: Doppelklick. Berührung: zwei kurze Tipps ohne Wischen nahe beieinander; Zwei-Finger-Gesten zählen nicht. */
let zoomBusy=false;
map.doubleClickZoom.disable();
function zoomIn(containerPt){
  const z=map.getZoom(),to=Math.min(z+1,map.getMaxZoom());if(to<=z)return;
  zoomBusy=true;
  /* Beim Verfolgen bleibt der Zug in der Mitte, sonst wird um die Tippstelle gezoomt */
  if(state.sel&&state.sel.follow)map.setZoom(to);else map.setZoomAround(containerPt,to);
  setTimeout(()=>{zoomBusy=false;},500);
}
(()=>{
  const el=map.getContainer(),down=new Map();let multi=false,last=null;
  const skip=t=>t.closest&&t.closest('.leaflet-control, .leaflet-popup, .leaflet-tooltip');
  el.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse')return;
    down.set(e.pointerId,{x:e.clientX,y:e.clientY,t:e.timeStamp});
    if(down.size>1)multi=true;
  });
  const end=e=>{
    if(e.pointerType==='mouse')return;
    const d=down.get(e.pointerId);down.delete(e.pointerId);
    if(!down.size){const was=multi;multi=false;if(was){last=null;return;}}else return;
    if(!d||skip(e.target))return;
    if(e.type==='pointercancel'||Math.hypot(e.clientX-d.x,e.clientY-d.y)>12||e.timeStamp-d.t>350){last=null;return;}
    if(last&&e.timeStamp-last.t<400&&Math.hypot(e.clientX-last.x,e.clientY-last.y)<40){
      last=null;zoomIn(map.mouseEventToContainerPoint(e));
    }else last={x:e.clientX,y:e.clientY,t:e.timeStamp};
  };
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('dblclick',e=>{if(!skip(e.target))zoomIn(map.mouseEventToContainerPoint(e));});
})();

/* ---------- Takt ---------- */
let moveTimer=null;
map.on('moveend',()=>{clearTimeout(stTimer);stTimer=setTimeout(loadStations,500);const c=map.getCenter();store.set('view',{c:[c.lat,c.lng],z:map.getZoom()});if(state.sel&&state.sel.follow&&map.getZoom()===loadedZoom)return;clearTimeout(moveTimer);moveTimer=setTimeout(()=>loadTrips(true),600);});
map.on('zoomend resize',paintChips);
map.on('dragstart',()=>{if(state.sel&&state.sel.follow){state.sel.follow=false;const b=$('followBtn');if(b)b.setAttribute('aria-pressed','false');}});
setInterval(()=>{if(!document.hidden)render();},1000);
setInterval(()=>{loadTrips();if(state.sel)loadTrip();if(state.sheet==='dep')renderDepartures();},30000);
setInterval(()=>{if(state.sheet==='fav'&&!document.hidden)renderFavs();},90000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadTrips();if(state.sel)loadTrip();}});
paintStation();paintChips();loadTrips();loadStations();
</script>
